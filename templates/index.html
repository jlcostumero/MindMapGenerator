  <script>
    // Datos del árbol en formato JSON


    var data = {};

    function buildTree(node, parent, level) {
      var ul = document.createElement("ul");
      parent.appendChild(ul);
      var li = document.createElement("li");
      li.textContent = '';
      if (level === 3) {
        li.classList.add("active");
      }
      ul.classList.add("collapsible");
      var header = document.createElement("div");
      header.textContent = '';
      header.classList.add("collapsible-header");
      header.classList.add("row");
      var size = 50 - (4 * level);
      if (level === 3) {
        header.innerHTML = header.innerHTML + "<i class='material-icons  s1 left more'  style='font-size: " + size + "px;display: none;'>expand_more</i>";
        header.innerHTML = header.innerHTML + "<i class='material-icons  s1 left less' style='font-size: " + size + "px'>expand_less</i>";
      } else {
        header.innerHTML = header.innerHTML + "<i class='material-icons  s1 left more'  style='font-size: " + size + "px'>expand_more</i>";
        header.innerHTML = header.innerHTML + "<i class='material-icons  s1 left less' style='font-size: " + size + "px;display: none;'>expand_less</i>";
      }
      header.innerHTML = "<i class='material-icons ' class='s2'  style='font-size: " + size + "px'>" + node.icon + "</i>" + header.innerHTML;
      header.innerHTML = header.innerHTML + "<h" + level + "><strong><span class='s9' style='font-weight: 400;'>" + header.name + "</span></strong></h" + level + ">";
      li.appendChild(header);
      if (!node.icon || (node.icon && node.icon === '')) {
        node.icon = 'remove';
      }
      var body = document.createElement("div");
      body.textContent = '';
      body.classList.add("collapsible-body");
      if (node.description) {
        var blockquote = document.createElement("blockquote");
        blockquote.textContent = '';
        blockquote.innerHTML = node.description;
        blockquote.innerHTML = blockquote.innerHTML.replace("<blockquote  class='miDiv'>", "<blockquote style='margin: 0px;'>");
        body.appendChild(blockquote);

      }
      if (node.keywords) {
        var keyContainer = document.createElement("div");
        keyContainer.textContent = '';
        keyContainer.classList.add("chips");
        keyContainer.classList.add("readonly");
        node.keywords.forEach(function (keyword) {
          var key = document.createElement("div");
          key.textContent = '';
          if (keyword.name) {
            key.innerHTML = node.name;
            key.innerHTML = "<i class='material-icons'>" + keyword.icon + "</i>" + capitalizeFirstLetter(keyword.name);
          } else {
            key.textContent = capitalizeFirstLetter(keyword);
          }

    function capitalizeFirstLetter(str) {
      var words = str.split(' ');
      for (var i = 0; i < words.length; i++) {
        var word = words[i];
        words[i] = word.charAt(0).toUpperCase() + word.slice(1);
      }
      return words.join(' ');
    }

    var intervalId;
        var eventSource = new EventSource('/notificaciones');
          eventSource.addEventListener('notificacion', function(event) {
          var data = JSON.parse(event.data);
          if(data.time){
            var progressBar = document.getElementById('progress-bar');
            var width = 0;
            var increment = 100 / (data.time * 1000 / 10); // Calcula el incremento en función de los segundos

        intervalId = setInterval(function() {
              width += increment;
              progressBar.style.width = width + '%';

              if (width >= 100) {
                clearInterval(intervalId);
              }
            }, 10); // Actualiza la barra de progreso cada 10 milisegundos
          }else if(data.parcial){
            var progressBar = document.getElementById('progress-bar');
            var width = 0;
            var increment = 50; // Calcula el incremento en función de los segundos
            if(data.parcial > 0){
              (data.total * 2) / data.parcial * 100;
            }
        intervalId = setInterval(function() {
              width += increment;
              progressBar.style.width = width + '%';
